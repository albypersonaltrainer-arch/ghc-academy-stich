name: Security Generate Lockfile Once

on:
  push:
    branches:
      - 'academy-security-final-audit-2026-08-16'
    paths:
      - '.github/workflows/security-generate-lockfile-once.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: academy-security-final-audit-2026-08-16

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already reproducible; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock production dependency graph"
          git push origin HEAD:academy-security-final-audit-2026-08-16
