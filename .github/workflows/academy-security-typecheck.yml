name: Academy Security Typecheck

on:
  push:
    branches:
      - 'academy-security-*'
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'supabase/migrations/**'
      - 'tsconfig.json'
      - 'package.json'
      - '.github/workflows/academy-security-typecheck.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript noEmit
        run: npx tsc --noEmit

      - name: Framework build without commercial gates
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          npx next build 2>&1 | tee next-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            node <<'NODE'
          const fs = require('node:fs')
          const text = fs.readFileSync('next-build.log', 'utf8')
          const lines = text.split(/\r?\n/)
          const tail = lines.slice(-25).join('\n').slice(-3500)
          const escaped = tail.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A')
          console.log(`::error title=Next build final error::${escaped}`)
          NODE
            exit "$status"
          fi

      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          const vulnerabilities = audit.vulnerabilities || {}
          let blocked = 0
          for (const [name, item] of Object.entries(vulnerabilities)) {
            if (!['high', 'critical'].includes(String(item.severity || '').toLowerCase())) continue
            blocked += 1
            const fix = item.fixAvailable && typeof item.fixAvailable === 'object'
              ? `${item.fixAvailable.name}@${item.fixAvailable.version}; semverMajor=${Boolean(item.fixAvailable.isSemVerMajor)}`
              : String(Boolean(item.fixAvailable))
            console.log(`::error title=Dependency ${name}::severity=${item.severity}; range=${item.range || 'unknown'}; fix=${fix}`)
            for (const via of item.via || []) {
              if (!via || typeof via !== 'object') continue
              const fields = [
                via.title ? `title=${via.title}` : '',
                via.url ? `url=${via.url}` : '',
                via.range ? `range=${via.range}` : '',
                via.severity ? `severity=${via.severity}` : ''
              ].filter(Boolean).join('; ')
              console.log(`::error title=${name} advisory::${fields}`)
            }
          }
          const meta = audit.metadata?.vulnerabilities || {}
          console.log(`npm audit: high=${meta.high || 0}, critical=${meta.critical || 0}`)
          if (blocked > 0) process.exit(1)
          NODE
