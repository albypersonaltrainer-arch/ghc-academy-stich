name: Preventa Scheduled Maintenance

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preventa-scheduled-maintenance
  cancel-in-progress: false

jobs:
  run-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PREVENTA_CRON_URL: ${{ secrets.PREVENTA_CRON_URL }}
      PREVENTA_CRON_SECRET: ${{ secrets.PREVENTA_CRON_SECRET }}

    steps:
      - name: Validate scheduler configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PREVENTA_CRON_URL}" ]; then
            echo "PREVENTA_CRON_URL is not configured"
            exit 1
          fi
          if [ "${#PREVENTA_CRON_SECRET}" -lt 32 ]; then
            echo "PREVENTA_CRON_SECRET is not configured correctly"
            exit 1
          fi

      - name: Run GHC Academy preventa maintenance
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 55 \
              --request POST \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${PREVENTA_CRON_SECRET}" \
              "${PREVENTA_CRON_URL}"
          )"

          if [ "${http_code}" != "200" ]; then
            echo "Preventa maintenance returned HTTP ${http_code}"
            cat "${response_file}"
            exit 1
          fi

          cat "${response_file}"