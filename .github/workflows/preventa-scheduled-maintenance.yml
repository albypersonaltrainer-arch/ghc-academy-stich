name: Preventa Scheduled Maintenance

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: preventa-scheduled-maintenance
  cancel-in-progress: false

jobs:
  run-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PREVENTA_CRON_URL: https://ghcacademy.net/api/preventa/cron
      PREVENTA_CRON_OIDC_AUDIENCE: https://ghcacademy.net/api/preventa/cron

    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --max-time 20 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PREVENTA_CRON_OIDC_AUDIENCE}"
          )"

          id_token="$(
            RESPONSE="${response}" node <<'NODE'
          const response = JSON.parse(process.env.RESPONSE || '{}')
          if (typeof response.value !== 'string' || response.value.length < 100) {
            process.exit(1)
          }
          process.stdout.write(response.value)
          NODE
          )"

          echo "::add-mask::${id_token}"
          echo "token=${id_token}" >> "${GITHUB_OUTPUT}"

      - name: Run GHC Academy preventa maintenance
        shell: bash
        env:
          PREVENTA_CRON_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --max-time 55 \
              --request GET \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${PREVENTA_CRON_OIDC_TOKEN}" \
              "${PREVENTA_CRON_URL}"
          )"

          if [ "${http_code}" != "200" ]; then
            echo "Preventa maintenance returned HTTP ${http_code}"
            cat "${response_file}"
            exit 1
          fi

          cat "${response_file}"
